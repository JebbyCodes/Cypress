name: Build DLL

on:
  workflow_dispatch:

jobs:
  build:
    # This workflow explicitly uses the Visual Studio 2022 installation.
    runs-on: windows-2022
    strategy:
      matrix:
        game: [GW1, GW2, BFN]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build
        working-directory: Server
        shell: pwsh
        run: |
          cmake --fresh -S . -B build -G "Visual Studio 17 2022" -A x64 -DCYPRESS_${{ matrix.game }}=ON
          cmake --build build --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cypress_${{ matrix.game }}
          path: Server/build/Release/cypress_${{ matrix.game }}.dll
